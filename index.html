<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>請求状況サンプルページ</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1f2933;
      --muted: #667085;
      --line: #d8dee4;
      --green: #157f5f;
      --green-soft: #dff4eb;
      --blue: #1f6feb;
      --blue-soft: #e8f1ff;
      --amber: #a15c00;
      --amber-soft: #fff1d6;
      --red: #b42318;
      --red-soft: #ffe4e0;
      --shadow: 0 14px 36px rgba(31, 41, 51, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    .app-shell { min-height: 100vh; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand { display: grid; gap: 2px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .brand span, .updated { color: var(--muted); font-size: 12px; }
    .main { padding: 22px 28px 32px; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .metric {
      min-height: 112px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 8px; font-size: 28px; font-weight: 750; }
    .metric-note { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .panel-title { margin: 0; font-size: 16px; }
    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
      background: var(--surface);
    }
    .filter-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 11px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-button.active { border-color: var(--green); background: var(--green-soft); color: #07513b; }
    .table-wrap { overflow: auto; max-height: 560px; }
    table { width: 100%; border-collapse: collapse; min-width: 1120px; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { position: sticky; top: 0; z-index: 2; background: #f8fafc; color: var(--muted); font-size: 12px; font-weight: 700; }
    td.amount, th.amount { text-align: right; }
    tr:hover td { background: #f9fbfa; }
    .customer { display: grid; gap: 2px; }
    .customer small { color: var(--muted); }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-paid { background: var(--green-soft); color: var(--green); }
    .badge-waiting { background: var(--amber-soft); color: var(--amber); }
    .badge-unissued { background: var(--red-soft); color: var(--red); }
    .badge-invoice { background: var(--blue-soft); color: var(--blue); }
    .action-button {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 10px;
      background: var(--surface);
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .action-button.primary { border-color: var(--green); background: var(--green); color: #fff; }
    .action-button:disabled { cursor: not-allowed; color: var(--muted); background: #f3f4f6; }
    .empty { padding: 36px 18px; color: var(--muted); text-align: center; }
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: #fbfcfd;
      flex-wrap: wrap;
    }
    .pagination-info { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .pagination-controls { display: flex; align-items: center; gap: 4px; }
    .page-button {
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .page-button:hover:not(:disabled) { background: #f3f4f6; }
    .page-button.active { border-color: var(--green); background: var(--green); color: #fff; cursor: default; }
    .page-button:disabled { cursor: not-allowed; color: var(--muted); background: #f3f4f6; }
    .page-button.ellipsis { border: none; background: none; cursor: default; color: var(--muted); }
    .page-size-select {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 10px;
      font: inherit;
      font-size: 13px;
      background: var(--surface);
      cursor: pointer;
    }
    @media (max-width: 960px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .workspace { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .main, .topbar { padding-left: 16px; padding-right: 16px; }
      .summary-grid { grid-template-columns: 1fr; }
      h1 { font-size: 20px; }
      .metric-value { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>請求状況サンプルページ</h1>
        <span>請求書発行状況サンプルデータから作成</span>
      </div>
      <div class="updated" id="updatedLabel"></div>
    </header>
    <main class="main">
      <section class="summary-grid" aria-label="サマリー">
        <article class="metric"><div class="metric-label">対象件数</div><div class="metric-value" id="totalCount">-</div><div class="metric-note">2026年5月請求分</div></article>
        <article class="metric"><div class="metric-label">領収書発行済み</div><div class="metric-value" id="receiptIssued">-</div><div class="metric-note" id="receiptIssuedAmount">-</div></article>
        <article class="metric"><div class="metric-label">入金待ち</div><div class="metric-value" id="waitingCount">-</div><div class="metric-note" id="waitingAmount">-</div></article>
        <article class="metric"><div class="metric-label">請求書未発行</div><div class="metric-value" id="unissuedCount">-</div><div class="metric-note" id="unissuedAmount">-</div></article>
      </section>
      <section class="workspace">
        <div class="panel">
          <div class="panel-header"><h2 class="panel-title">明細一覧</h2><span id="visibleCount" class="updated"></span></div>
          <div class="controls">
            <input class="search" id="searchInput" type="search" placeholder="顧客名・契約ID・サービス・倉庫で検索">
            <div class="filter-buttons" id="filterButtons">
              <button class="filter-button active" data-status="all">すべて</button>
              <button class="filter-button" data-status="領収書発行済み">発行済み</button>
              <button class="filter-button" data-status="入金待ち">入金待ち</button>
              <button class="filter-button" data-status="請求書未発行">未発行</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>顧客</th><th>サービス</th><th>倉庫</th><th>請求月</th><th>請求状況</th><th class="amount">請求金額</th><th>支払期限</th><th>支払日</th><th>操作</th></tr></thead>
              <tbody id="tableBody"></tbody>
            </table>
            <div class="empty" id="emptyState" hidden>条件に一致する明細はありません。</div>
          </div>
          <div class="pagination-bar" id="paginationBar">
            <div class="pagination-info" id="paginationInfo"></div>
            <div style="display:flex;align-items:center;gap:12px;">
              <select class="page-size-select" id="pageSizeSelect">
                <option value="10">10件</option>
                <option value="25" selected>25件</option>
                <option value="50">50件</option>
              </select>
              <div class="pagination-controls" id="paginationControls"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

発行不可"},{"customerId":"CUST0146","customerName":"株式会社池袋メディアサービス","contractId":"CT000146","service":"文書保管サービス","billingMonth":"2026年5月","invoiceDate":"2026/05/01","amount":67200,"usageGb":1650,"invoiceStatus":"支払完了","dueDate":"2026/05/31","paidDate":"2026/05/24","receiptStatus":"領収書発行済み","action":"再発行"},{"customerId":"CUST0147","customerName":"株式会社池袋データソリューション","contractId":"CT000147","service":"スポット保管","billingMonth":"2026年5月","invoiceDate":"2026/05/06","amount":22800,"usageGb":4670,"invoiceStatus":"発行済み","dueDate":"2026/06/05","paidDate":"","receiptStatus":"入金待ち","action":"発行不可"},{"customerId":"CUST0148","customerName":"株式会社池袋オフィス管理","contractId":"CT000148","service":"CLOUD CABINET + 文書保管","billingMonth":"2026年5月","invoiceDate":"2026/05/02","amount":88300,"usageGb":2380,"invoiceStatus":"支払完了","dueDate":"2026/06/01","paidDate":"2026/05/13","receiptStatus":"領収書発行済み","action":"再発行"},{"customerId":"CUST0149","customerName":"株式会社池袋クラウド文書","contractId":"CT000149","service":"CLOUD CABINET","billingMonth":"2026年5月","invoiceDate":"2026/05/05","amount":39100,"usageGb":3120,"invoiceStatus":"未発行","dueDate":"","paidDate":"","receiptStatus":"請求書未発行","action":"確認"},{"customerId":"CUST0150","customerName":"株式会社池袋総合倉庫","contractId":"CT000150","service":"文書保管サービス","billingMonth":"2026年5月","invoiceDate":"2026/05/04","amount":25670,"usageGb":1790,"invoiceStatus":"発行済み","dueDate":"2026/06/03","paidDate":"","receiptStatus":"入金待ち","action":"発行不可"}];
    const WAREHOUSES = ["館林倉庫", "芝浦倉庫", "仙台倉庫", "千代田倉庫"];
    rows.forEach((row, index) => {
      row.warehouse = WAREHOUSES[index % WAREHOUSES.length];
    });

    const state = { status: "all", query: "", page: 1, pageSize: 25 };
    const yen = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 });
    const number = new Intl.NumberFormat("ja-JP");
    const statusClass = { "領収書発行済み": "badge-paid", "入金待ち": "badge-waiting", "請求書未発行": "badge-unissued" };
    const invoiceClass = { "支払完了": "badge-paid", "発行済み": "badge-invoice", "未発行": "badge-unissued" };

    document.querySelector("#updatedLabel").textContent = `最終更新: ${new Date().toLocaleDateString("ja-JP")}`;
    document.querySelector("#searchInput").addEventListener("input", (event) => { state.query = event.target.value.trim().toLowerCase(); state.page = 1; render(); });
    document.querySelector("#filterButtons").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-status]");
      if (!button) return;
      state.status = button.dataset.status;
      state.page = 1;
      document.querySelectorAll(".filter-button").forEach((item) => item.classList.toggle("active", item === button));
      render();
    });
    document.querySelector("#pageSizeSelect").addEventListener("change", (event) => {
      state.pageSize = Number(event.target.value);
      state.page = 1;
      render();
    });

    function render() {
      renderMetrics();
      renderTable();
    }

    function renderMetrics() {
      const paid = rows.filter((row) => row.receiptStatus === "領収書発行済み");
      const waiting = rows.filter((row) => row.receiptStatus === "入金待ち");
      const unissued = rows.filter((row) => row.receiptStatus === "請求書未発行");
      document.querySelector("#totalCount").textContent = `${number.format(rows.length)}件`;
      document.querySelector("#receiptIssued").textContent = `${number.format(paid.length)}件`;
      document.querySelector("#waitingCount").textContent = `${number.format(waiting.length)}件`;
      document.querySelector("#unissuedCount").textContent = `${number.format(unissued.length)}件`;
      document.querySelector("#receiptIssuedAmount").textContent = yen.format(sumAmount(paid));
      document.querySelector("#waitingAmount").textContent = yen.format(sumAmount(waiting));
      document.querySelector("#unissuedAmount").textContent = yen.format(sumAmount(unissued));
    }

    function renderTable() {
      const filtered = getFilteredRows();
      const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
      if (state.page > totalPages) state.page = totalPages;
      const start = (state.page - 1) * state.pageSize;
      const paged = filtered.slice(start, start + state.pageSize);
      const body = document.querySelector("#tableBody");
      body.replaceChildren(...paged.map(createRow));
      document.querySelector("#emptyState").hidden = filtered.length > 0;
      document.querySelector("#visibleCount").textContent = `${number.format(filtered.length)} / ${number.format(rows.length)}件`;
      renderPagination(filtered.length, totalPages);
    }

    function renderPagination(filteredTotal, totalPages) {
      const start = (state.page - 1) * state.pageSize + 1;
      const end = Math.min(state.page * state.pageSize, filteredTotal);
      document.querySelector("#paginationInfo").textContent =
        filteredTotal === 0 ? "0件" : `${number.format(start)}–${number.format(end)} 件 / 全${number.format(filteredTotal)}件中`;

      const controls = document.querySelector("#paginationControls");
      controls.replaceChildren();

      const addBtn = (label, page, active = false, disabled = false, ellipsis = false) => {
        const btn = document.createElement("button");
        btn.className = "page-button" + (active ? " active" : "") + (ellipsis ? " ellipsis" : "");
        btn.textContent = label;
        btn.disabled = disabled || ellipsis;
        if (!disabled && !ellipsis && !active) btn.addEventListener("click", () => { state.page = page; renderTable(); });
        controls.appendChild(btn);
      };

      addBtn("←", state.page - 1, false, state.page === 1);

      const pages = buildPageRange(state.page, totalPages);
      let prev = null;
      for (const p of pages) {
        if (prev !== null && p - prev > 1) addBtn("…", null, false, false, true);
        addBtn(String(p), p, p === state.page);
        prev = p;
      }

      addBtn("→", state.page + 1, false, state.page === totalPages);
    }

    function buildPageRange(current, total) {
      if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
      const pages = new Set([1, total, current]);
      for (let d = 1; d <= 2; d++) {
        if (current - d >= 1) pages.add(current - d);
        if (current + d <= total) pages.add(current + d);
      }
      return [...pages].sort((a, b) => a - b);
    }

    function createRow(row) {
      const tr = document.createElement("tr");
      const canIssue = row.receiptStatus === "領収書発行済み";
      tr.innerHTML = `
        <td><div class="customer"><strong>${escapeHtml(row.customerName)}</strong><small>${escapeHtml(row.customerId)} / ${escapeHtml(row.contractId)}</small></div></td>
        <td>${escapeHtml(row.service)}</td>
        <td>${escapeHtml(row.warehouse)}</td>
        <td>${escapeHtml(row.billingMonth)}</td>
        <td><span class="badge ${invoiceClass[row.invoiceStatus]}">${escapeHtml(row.invoiceStatus)}</span></td>
        <td class="amount">${yen.format(row.amount)}</td>
        <td>${escapeHtml(row.dueDate || "-")}</td>
        <td>${escapeHtml(row.paidDate || "-")}</td>
        <td><button class="action-button ${canIssue ? "primary" : ""}" ${canIssue ? "" : "disabled"}>${escapeHtml(row.action)}</button></td>`;
      return tr;
    }

    function getFilteredRows() {
      return rows.filter((row) => {
        const statusOk = state.status === "all" || row.receiptStatus === state.status;
        const haystack = [row.customerName, row.customerId, row.contractId, row.service, row.warehouse, row.invoiceStatus, row.receiptStatus].join(" ").toLowerCase();
        return statusOk && (!state.query || haystack.includes(state.query));
      });
    }
    function sumAmount(items) { return items.reduce((total, row) => total + Number(row.amount || 0), 0); }
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char])); }
    render();
  </script>
