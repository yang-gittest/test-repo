<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>再出力 - プレビュー | サンプル業務システム</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <strong>Sample 業務システム</strong>
        <span>マニュアル自動生成 テスト用</span>
      </div>
      <div class="nav-section">メニュー</div>
      <a class="nav-item" href="home.html"><span class="ic">🏠</span> ダッシュボード</a>
      <a class="nav-item active" href="billing.html"><span class="ic">📄</span> 請求管理</a>
      <a class="nav-item disabled" href="#"><span class="ic">👥</span> 顧客管理</a>
      <a class="nav-item disabled" href="#"><span class="ic">📊</span> レポート</a>
      <div class="nav-section">その他</div>
      <a class="nav-item" href="index.html"><span class="ic">📈</span> 請求状況（旧画面）</a>
      <a class="nav-item disabled" href="#"><span class="ic">⚙️</span> 設定</a>
    </aside>

    <div class="content">
      <header class="topbar">
        <div>
          <h1>請求データ 再出力</h1>
          <div class="sub">ステップ 2 / 3 ・ プレビュー確認</div>
        </div>
        <div class="user"><span>山田 太郎</span><span class="avatar">山</span></div>
      </header>
      <main class="main">
        <nav class="breadcrumb">
          <a href="home.html">ダッシュボード</a><span class="sep">›</span>
          <a href="billing.html#reoutput">請求管理 / 再出力</a><span class="sep">›</span>
          <a href="reoutput-select.html">対象選択</a><span class="sep">›</span>
          <span>プレビュー</span>
        </nav>

        <div class="steps">
          <div class="step done"><span class="num">✓</span> 対象選択</div>
          <div class="step active"><span class="num">2</span> プレビュー</div>
          <div class="step"><span class="num">3</span> 実行・完了</div>
        </div>

        <div class="panel">
          <div class="panel-header"><h2 class="panel-title">出力内容の確認</h2></div>
          <div class="panel-body">
            <div class="preview-box" style="margin-bottom:18px;">
              <dl>
                <dt>出力形式</dt><dd id="pvFormat">-</dd>
                <dt>対象件数</dt><dd id="pvCount">-</dd>
                <dt>合計金額</dt><dd id="pvTotal">-</dd>
              </dl>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>請求ID</th><th>顧客</th><th>サービス</th><th>請求月</th><th class="amount">請求金額</th></tr></thead>
                <tbody id="pvBody"></tbody>
              </table>
            </div>
          </div>
          <div class="panel-body toolbar" style="border-top:1px solid var(--line);">
            <a class="btn" href="reoutput-select.html">← 選択に戻る</a>
            <button class="btn btn-primary" id="execute">この内容で再出力を実行 →</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const yen = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 });
    const data = JSON.parse(sessionStorage.getItem("reoutputSelection") || "null");

    if (!data || !data.items || data.items.length === 0) {
      // 直接アクセスされた場合は選択画面へ
      location.replace("reoutput-select.html");
    } else {
      const total = data.items.reduce((s, r) => s + r.amount, 0);
      document.getElementById("pvFormat").textContent = data.format;
      document.getElementById("pvCount").textContent = `${data.items.length} 件`;
      document.getElementById("pvTotal").textContent = yen.format(total);
      const body = document.getElementById("pvBody");
      data.items.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${r.id}</td><td>${r.customer}</td><td>${r.service}</td><td>${r.month}</td><td class="amount">${yen.format(r.amount)}</td>`;
        body.appendChild(tr);
      });
      document.getElementById("execute").addEventListener("click", () => {
        location.href = "reoutput-done.html";
      });
    }
  </script>
</body>
</html>
