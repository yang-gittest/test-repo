<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>再出力 - 対象選択 | サンプル業務システム</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <strong>Sample 業務システム</strong>
        <span>マニュアル自動生成 テスト用</span>
      </div>
      <div class="nav-section">メニュー</div>
      <a class="nav-item" href="home.html"><span class="ic">🏠</span> ダッシュボード</a>
      <a class="nav-item active" href="billing.html"><span class="ic">📄</span> 請求管理</a>
      <a class="nav-item disabled" href="#"><span class="ic">👥</span> 顧客管理</a>
      <a class="nav-item disabled" href="#"><span class="ic">📊</span> レポート</a>
      <div class="nav-section">その他</div>
      <a class="nav-item" href="guide.html"><span class="ic">📘</span> 例題</a>
      <a class="nav-item" href="index.html"><span class="ic">📈</span> 請求状況（旧画面）</a>
      <a class="nav-item disabled" href="#"><span class="ic">⚙️</span> 設定</a>
    </aside>

    <div class="content">
      <header class="topbar">
        <div>
          <h1>請求データ 再出力</h1>
          <div class="sub">ステップ 1 / 3 ・ 対象を選択</div>
        </div>
        <div class="user"><span>山田 太郎</span><span class="avatar">山</span></div>
      </header>
      <main class="main">
        <nav class="breadcrumb">
          <a href="home.html">ダッシュボード</a><span class="sep">›</span>
          <a href="billing.html#reoutput">請求管理 / 再出力</a><span class="sep">›</span>
          <span>対象選択</span>
        </nav>

        <div class="steps">
          <div class="step active"><span class="num">1</span> 対象選択</div>
          <div class="step"><span class="num">2</span> プレビュー</div>
          <div class="step"><span class="num">3</span> 実行・完了</div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">再出力する請求データを選択</h2>
            <span class="note" id="selCount">0 件選択中</span>
          </div>
          <div class="panel-body">
            <div class="form-row" style="border:none;padding-bottom:4px;">
              <label>出力形式</label>
              <select class="field" id="format"><option>PDF</option><option>CSV</option><option>Excel</option></select>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="check"><input type="checkbox" id="checkAll"></th>
                  <th>請求ID</th><th>顧客</th><th>サービス</th><th>請求月</th><th>状況</th><th class="amount">請求金額</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="panel-body toolbar" style="border-top:1px solid var(--line);">
            <a class="btn" href="billing.html#reoutput">← 戻る</a>
            <button class="btn btn-primary" id="toPreview" disabled>プレビューへ進む →</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const DATA = [
      { id: "INV-2605-001", customer: "株式会社アルファ",       service: "倉庫保管 A", month: "2026-05", status: "発行済み", cls: "badge-paid",     amount: 240000 },
      { id: "INV-2605-002", customer: "ベータ商事株式会社",     service: "倉庫保管 B", month: "2026-05", status: "入金待ち", cls: "badge-waiting",  amount: 180000 },
      { id: "INV-2605-003", customer: "ガンマ物流株式会社",     service: "配送代行",   month: "2026-05", status: "未発行",   cls: "badge-unissued", amount: 95000 },
      { id: "INV-2605-004", customer: "デルタ工業株式会社",     service: "倉庫保管 A", month: "2026-05", status: "発行済み", cls: "badge-paid",     amount: 320000 },
      { id: "INV-2605-005", customer: "イプシロン株式会社",     service: "梱包代行",   month: "2026-05", status: "入金待ち", cls: "badge-waiting",  amount: 58000 },
      { id: "INV-2605-006", customer: "ゼータ流通株式会社",     service: "倉庫保管 C", month: "2026-05", status: "発行済み", cls: "badge-paid",     amount: 410000 },
    ];
    const yen = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 });
    const tbody = document.getElementById("tbody");
    const checkAll = document.getElementById("checkAll");
    const selCount = document.getElementById("selCount");
    const toPreview = document.getElementById("toPreview");

    DATA.forEach((r, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML =
        `<td class="check"><input type="checkbox" class="row-check" data-i="${i}"></td>` +
        `<td>${r.id}</td>` +
        `<td>${r.customer}</td>` +
        `<td>${r.service}</td>` +
        `<td>${r.month}</td>` +
        `<td><span class="badge ${r.cls}">${r.status}</span></td>` +
        `<td class="amount">${yen.format(r.amount)}</td>`;
      tbody.appendChild(tr);
    });

    function refresh() {
      const checks = [...document.querySelectorAll(".row-check")];
      const selected = checks.filter(c => c.checked);
      checks.forEach(c => c.closest("tr").classList.toggle("selected", c.checked));
      selCount.textContent = `${selected.length} 件選択中`;
      toPreview.disabled = selected.length === 0;
      checkAll.checked = selected.length === checks.length && checks.length > 0;
    }

    tbody.addEventListener("change", refresh);
    checkAll.addEventListener("change", () => {
      document.querySelectorAll(".row-check").forEach(c => c.checked = checkAll.checked);
      refresh();
    });

    toPreview.addEventListener("click", () => {
      const selected = [...document.querySelectorAll(".row-check")]
        .filter(c => c.checked).map(c => DATA[+c.dataset.i]);
      sessionStorage.setItem("reoutputSelection", JSON.stringify({
        format: document.getElementById("format").value,
        items: selected,
      }));
      location.href = "reoutput-preview.html";
    });
  </script>
</body>
</html>
