<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>再出力 - 完了 | サンプル業務システム</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <strong>Sample 業務システム</strong>
        <span>マニュアル自動生成 テスト用</span>
      </div>
      <div class="nav-section">メニュー</div>
      <a class="nav-item" href="home.html"><span class="ic">🏠</span> ダッシュボード</a>
      <a class="nav-item active" href="billing.html"><span class="ic">📄</span> 請求管理</a>
      <a class="nav-item disabled" href="#"><span class="ic">👥</span> 顧客管理</a>
      <a class="nav-item disabled" href="#"><span class="ic">📊</span> レポート</a>
      <div class="nav-section">その他</div>
      <a class="nav-item" href="guide.html"><span class="ic">📘</span> 例題</a>
      <a class="nav-item" href="index.html"><span class="ic">📈</span> 請求状況（旧画面）</a>
      <a class="nav-item disabled" href="#"><span class="ic">⚙️</span> 設定</a>
    </aside>

    <div class="content">
      <header class="topbar">
        <div>
          <h1>請求データ 再出力</h1>
          <div class="sub">ステップ 3 / 3 ・ 完了</div>
        </div>
        <div class="user"><span>山田 太郎</span><span class="avatar">山</span></div>
      </header>
      <main class="main">
        <div class="steps">
          <div class="step done"><span class="num">✓</span> 対象選択</div>
          <div class="step done"><span class="num">✓</span> プレビュー</div>
          <div class="step active"><span class="num">✓</span> 実行・完了</div>
        </div>

        <div class="done-wrap">
          <div class="done-icon">✓</div>
          <h2>再出力が完了しました</h2>
          <p id="doneMsg">選択した請求データの再出力処理が正常に完了しました。</p>
          <div class="preview-box" style="text-align:left;margin-bottom:22px;">
            <dl>
              <dt>出力形式</dt><dd id="dnFormat">-</dd>
              <dt>出力件数</dt><dd id="dnCount">-</dd>
              <dt>受付番号</dt><dd>REQ-20260512-0001</dd>
            </dl>
          </div>
          <div class="done-actions">
            <a class="btn" href="billing.html#reoutput">再出力メニューに戻る</a>
            <a class="btn btn-primary" href="home.html">ダッシュボードへ</a>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const data = JSON.parse(sessionStorage.getItem("reoutputSelection") || "null");
    if (data && data.items) {
      document.getElementById("dnFormat").textContent = data.format;
      document.getElementById("dnCount").textContent = `${data.items.length} 件`;
    }
    // 完了後は選択状態をクリア
    sessionStorage.removeItem("reoutputSelection");
  </script>
</body>
</html>
